services:
  - type: web
    name: nomly-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        value: sqlite:////var/data/nomly.db
      - key: CORS_ORIGINS
        value: https://nomly-seven.vercel.app,http://localhost:3000
    disk:
      name: nomly-data
      mountPath: /var/data
      sizeGB: 1
